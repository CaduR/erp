# Configuração para testes
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration para testes
jwt.secret=testSecretKey123456789012345678901234567890123456789012345678901234567890
jwt.expiration=3600

# Desabilitar logging excessivo nos testes
logging.level.com.cadu.erp=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Configurações do servidor para testes
server.port=0 