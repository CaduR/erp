<div class="container-box">
  <div class="card-header">
    <h1><i class="fas fa-file-invoice-dollar"></i> {{ isEditMode ? 'Editar Conta a Receber' : 'Nova Conta a Receber' }}</h1>
  </div>

  <form [formGroup]="contaReceberForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="descricao">Descrição</label>
      <input id="descricao" formControlName="descricao" placeholder="Ex: Venda de produtos">
    </div>

    <div class="form-group">
      <label for="valor">Valor</label>
      <input id="valor" type="number" formControlName="valor" placeholder="0,00">
    </div>

    <div class="form-group">
      <label for="dataVencimento">Data de Vencimento</label>
      <input id="dataVencimento" type="date" formControlName="dataVencimento">
    </div>

    <div class="form-group">
      <label for="clienteId">Cliente</label>
      <select id="clienteId" formControlName="clienteId">
        <option [ngValue]="null">Selecione um cliente</option>
        <option *ngFor="let cliente of clientes$ | async" [ngValue]="cliente.id">{{ cliente.nome }}</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="button" [disabled]="contaReceberForm.invalid">Salvar</button>
      <button type="button" class="button secondary" routerLink="/financeiro/contas-receber">Cancelar</button>
    </div>
  </form>
</div>
