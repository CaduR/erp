<div class="container-box">
  <div class="card-header">
    <h1><i class="fas fa-users-cog"></i> Gerenciamento de Usuários</h1>
    <button class="button" routerLink="/security/usuarios/cadastro">
      <i class="fas fa-user-plus"></i> Novo Usuário
    </button>
  </div>

  <p class="text-light">Gerencie os usuários do sistema e suas permissões.</p>

  <table *ngIf="usuarios$ | async as usuarios; else loadingOrError" class="table-hover">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Ativo</th>
        <th>Roles</th>
        <th class="text-center">Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let usuario of usuarios">
        <td data-label="Username">{{ usuario.username }}</td>
        <td data-label="Email">{{ usuario.email }}</td>
        <td data-label="Ativo">
          <span class="badge" [ngClass]="usuario.ativo ? 'success' : 'error'">
            {{ usuario.ativo ? 'Sim' : 'Não' }}
          </span>
        </td>
        <td data-label="Roles">
          <span *ngFor="let role of usuario.roles" class="badge badge-info">{{ role.name }}</span>
        </td>
        <td data-label="Ações" class="table-actions">
          <button class="button icon-only" (click)="visualizarUsuario(usuario.id)" title="Visualizar">
            <i class="fas fa-eye"></i>
          </button>
          <button class="button icon-only" (click)="editarUsuario(usuario.id)" title="Editar">
            <i class="fas fa-edit"></i>
          </button>
          <button class="button error icon-only" (click)="deletarUsuario(usuario.id)" title="Deletar">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>
      <tr *ngIf="usuarios.length === 0">
        <td colspan="5" class="text-center">Nenhum usuário cadastrado.</td>
      </tr>
    </tbody>
  </table>

  <ng-template #loadingOrError>
    <div class="text-center">
      <app-loading *ngIf="!error; else errorState"></app-loading>
      <ng-template #errorState>
        <p class="text-error">Falha ao carregar usuários. Tente novamente mais tarde.</p>
      </ng-template>
    </div>
  </ng-template>
</div>
