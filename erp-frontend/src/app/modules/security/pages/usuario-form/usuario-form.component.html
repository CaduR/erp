<div class="container-box">
  <div class="card-header">
    <h1><i class="fas fa-user-edit"></i> {{ isEditMode ? 'Editar Usuário' : 'Novo Usuário' }}</h1>
  </div>

  <form [formGroup]="usuarioForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" formControlName="username" placeholder="Ex: joao.silva" [readonly]="isViewMode">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Ex: joao.silva@empresa.com" [readonly]="isViewMode">
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password" placeholder="********" [readonly]="isViewMode">
    </div>

    <div class="form-group">
      <label for="ativo">Ativo</label>
      <label class="switch">
        <input id="ativo" type="checkbox" formControlName="ativo" [disabled]="isViewMode">
        <span class="slider round">
          <span class="switch-label">{{ usuarioForm.get('ativo')?.value ? 'Ativo' : 'Inativo' }}</span>
        </span>
      </label>
    </div>

    <div class="form-group">
      <label for="role">Função do Utilizador</label>
      <select id="role" formControlName="roleIds" [disabled]="isViewMode">
        <option value="" disabled>Selecione uma função</option>
        <option *ngFor="let role of allRoles$ | async" [value]="role.id">{{ role.name }}</option>
      </select>
    </div>

    <div class="form-actions">
      <button *ngIf="!isViewMode" type="submit" class="button" [disabled]="usuarioForm.invalid">Salvar</button>
      <button type="button" class="button secondary" routerLink="/security/usuarios">Voltar</button>
    </div>
  </form>
</div>
