<div class="container-box">
  <div class="card-header">
    <h1><i class="fas fa-truck-loading"></i> {{ isEditMode ? 'Editar Fornecedor' : 'Novo Fornecedor' }}</h1>
  </div>

  <form [formGroup]="fornecedorForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nome">Nome / Razão Social</label>
      <input id="nome" formControlName="nome" placeholder="Ex: Distribuidora de Peças LTDA">
    </div>

    <div class="form-group">
      <label for="cnpj">CNPJ</label>
      <input id="cnpj" formControlName="cnpj" placeholder="Ex: 00.000.000/0001-00">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Ex: contato@distribuidora.com">
    </div>

    <div class="form-group">
      <label for="telefone">Telefone</label>
      <input id="telefone" formControlName="telefone" placeholder="Ex: (11) 4004-4004">
    </div>

    <div class="form-actions">
      <button type="submit" class="button" [disabled]="fornecedorForm.invalid">Salvar</button>
      <button type="button" class="button secondary" routerLink="/compras/fornecedores">Cancelar</button>
    </div>
  </form>
</div>
