<div class="container-box">
  <div class="card-header">
    <h1><i class="fas fa-user-plus"></i> {{ isEditMode ? 'Editar Cliente' : 'Novo Cliente' }}</h1>
  </div>

  <form [formGroup]="clienteForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nome">Nome / Razão Social</label>
      <input id="nome" formControlName="nome" placeholder="Ex: João da Silva">
    </div>

    <div class="form-group">
      <label for="documento">CPF / CNPJ</label>
      <input id="documento" formControlName="documento" placeholder="Ex: 123.456.789-00">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Ex: contato@email.com">
    </div>

    <div class="form-group">
      <label for="telefone">Telefone</label>
      <input id="telefone" formControlName="telefone" placeholder="Ex: (11) 99999-9999">
    </div>

    <div class="form-actions">
      <button type="submit" class="button" [disabled]="clienteForm.invalid">Salvar</button>
      <button type="button" class="button secondary" routerLink="/vendas/clientes">Cancelar</button>
    </div>
  </form>
</div>
